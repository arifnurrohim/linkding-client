name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets before publishing."
            exit 1
          fi

      - name: Set release version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag must look like v1.2.3 (optionally v1.2.3-beta.1)."
            exit 1
          fi
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building LinkDing $VERSION_NAME ($VERSION_CODE)"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkding-release.keystore"
          test -s "$RUNNER_TEMP/linkding-release.keystore"

      - name: Build release APK
        env:
          KEYSTORE: ${{ runner.temp }}/linkding-release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare release assets
        run: |
          ASSET="LinkDing-${VERSION_NAME}.apk"
          cp LinkDing.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" \
              "$ASSET#LinkDing ${VERSION_NAME} APK" \
              "$ASSET.sha256#SHA-256 checksum" \
              --title "LinkDing ${VERSION_NAME}" \
              --generate-notes \
              --verify-tag
          fi
